services:
  mysql:
    image: mysql:8.4
    container_name: mishi-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: mishi
      MYSQL_USER: mishi
      MYSQL_PASSWORD: mishi123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ../backend/src/main/resources/db/data.sql:/docker-entrypoint-initdb.d/2-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-hmysql", "-umishi", "-pmishi123"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: mishi-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: mishi-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: mishi
      RABBITMQ_DEFAULT_PASS: mishi123
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  mysql-data:
  redis-data:
